  --page:#070807; --bg:#101211; --card:#1A1D1B; --sub:#222624; --sub2:#2A2F2C; --line:#2E3330;
  --ink:#F2F4F2; --ink2:#CDD2CE; --ink3:#A9AFAB;
  --acc:#3DBE74; --acc-d:#0D3A21; --acc-m:#2E9A5C; --acc-l:#163826; --acc-ink:#05140B;
  --ok:#7BE3A4; --ok-bg:rgb(34 197 94/.15); --ok-f:#34C26E;
  --warn:#F8D16B; --warn-bg:rgb(245 158 11/.16); --warn-f:#E8B020;
  --bad:#FFA39E; --bad-bg:rgb(239 68 68/.17); --bad-f:#F0605D;
  --neu:#CDD2CE; --neu-bg:#2A2F2C; --neu-f:#7E8580; --pend-f:#6B716D;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25);
  --shadow-h:0 2px 6px rgb(0 0 0/.35),0 18px 40px rgb(0 0 0/.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto 1fr;margin:12px;min-height:calc(100vh - 24px);background:var(--bg);border-radius:var(--r-shell);transition:background .3s}
.hero{grid-column:1/-1;position:relative;margin:14px 14px 0;min-height:108px;display:flex;align-items:center;gap:24px;padding:18px 64px 18px 26px;color:#fff;z-index:20}
.hero-bg{position:absolute;inset:0;border-radius:24px;background:radial-gradient(120% 160% at 100% 0%,rgb(110 190 140/.55) 0%,transparent 45%),linear-gradient(135deg,#1C8549 0%,#137240 45%,#0B4A28 100%);clip-path:polygon(0 0,calc(100% - 52px) 0,100% 52px,100% 100%,0 100%);z-index:-1;overflow:hidden}
.hero-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(rgb(255 255 255/.12) 1px,transparent 1.4px) 0 0/16px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 85%);mask-image:linear-gradient(90deg,transparent 35%,#000 85%)}
.hero-logo{background:#fff;border-radius:14px;padding:4px;flex:none;box-shadow:0 6px 18px rgb(0 0 0/.16);line-height:0}
.hero-logo img{display:block;height:60px;width:auto}
.hero-t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:0 1 auto}
.hero-t b,.hero-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-t b{font-size:15px;letter-spacing:-.01em}
.hero-t span{font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:7px}
.hero-t .dot{background:#9BF0BE;box-shadow:0 0 0 3px rgb(255 255 255/.18)}
.hero-r{margin-left:auto;flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;justify-content:flex-end;color:var(--ink)}
.hero .search{flex:1 1 300px;max-width:420px;min-width:190px;height:48px}
.hero .ctx{flex:none}.hero .ctx>button{height:48px}
.tsep{width:1px;height:24px;background:#e2e2e6;margin:0 3px;align-self:center}
.tseg .bellb{position:relative}
.tseg .pip{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:999px;background:#E5484D;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.tseg .bellb:hover{background:#f2f2f3}
@media (max-width:1360px){.hero-t{display:none}}
@media (max-width:1180px) and (min-width:769px){.hero .ctx .sm{display:none}.hero .search{min-width:150px}}
.hero .isl,.hero .ctx>button,.hero .ibtn{background:#fff;color:#111;box-shadow:0 4px 14px rgb(0 0 0/.12)}
.hero .isl input::placeholder,.hero .ctx .sm{color:#55555c}
.hero .kbd{border-color:#ddd;color:#55555c;background:#f2f2f3}
.hero .mono{background:#DDEFE4;color:#006F32}
.tseg{display:flex;align-items:center;flex:none;gap:4px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 4px 14px rgb(0 0 0/.12)}
.tseg button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#3a3a42;transition:background .25s var(--ease),color .25s}
.tseg button[aria-checked="true"]{background:#111;color:#fff}
.side{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:6px;padding:20px 16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 8px 18px}
.brand .logo{background:#fff;border-radius:14px;padding:8px 10px;width:max-content;box-shadow:var(--shadow)}
.brand img{display:block;height:34px;width:auto}
.brand-sub{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.02em}
.nav-h{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--ink3);margin:14px 10px 6px}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav-ind{position:absolute;left:0;right:0;top:0;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);transition:transform .35s var(--ease),height .35s var(--ease);z-index:0}
.nav-ind::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.nav-b{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:14px;color:var(--ink2);font-weight:600}
.nav-b:hover{color:var(--ink)}
.nav-b[aria-current="page"]{color:var(--ink)}
.nav-b[aria-current="page"] svg{color:var(--acc)}
.nav-b .lbl{flex:1}
.badge{min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--sub2);color:var(--ink2)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.acc{background:var(--acc);color:var(--acc-ink)}
.sw{width:36px;height:22px;border-radius:999px;background:var(--sub2);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.25);transition:transform .25s var(--ease)}
[aria-checked="true"] .sw{background:var(--acc)}
[aria-checked="true"] .sw::after{transform:translateX(14px)}
.side-card{margin-top:22px;border-radius:20px;padding:18px 18px 20px;color:#fff;background:radial-gradient(120% 160% at 100% 0%,rgb(110 190 140/.55) 0%,transparent 45%),linear-gradient(135deg,#1C8549 0%,#137240 45%,#0B4A28 100%);position:relative;flex:none}
.side-card .t{font-size:11px;letter-spacing:.1em;font-weight:700;opacity:.88;line-height:1.3}
.side-card .d{font-size:24px;line-height:1.15;font-weight:750;letter-spacing:-.02em;margin:6px 0 10px;white-space:nowrap}
.side-card p{margin:0;font-size:12.5px;opacity:.92}
.side-card button{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0B3B1E;border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px}

/* ---------- top ---------- */
.main{min-width:0;padding:20px 28px 48px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.isl{background:var(--card);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 16px}
.search{flex:1 1 280px;position:relative;max-width:440px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search input::placeholder{color:var(--ink3)}
.kbd{font-size:11px;font-weight:700;color:var(--ink3);border:1px solid var(--line);border-radius:7px;padding:2px 7px;margin-right:6px}
.sres{position:absolute;left:0;right:0;top:52px;background:var(--card);border-radius:18px;box-shadow:var(--shadow-h);padding:6px;z-index:60;max-height:420px;overflow:auto}
.sres button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:12px}
.sres button[aria-selected="true"],.sres button:hover{background:var(--sub)}
.sres .ty{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink3);min-width:62px}
.sres .no{padding:14px;color:var(--ink3)}
.ctx{position:relative}
.ctx>button{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);max-width:100%}
.mono{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--acc-l);color:var(--acc);flex:none;letter-spacing:.02em}
.mono.lg{width:48px;height:48px;border-radius:16px;font-size:14px}
.ctx .nm{font-weight:700;white-space:nowrap}
.ctx .sm{font-size:12px;color:var(--ink3);white-space:nowrap}
.ctx-l{position:absolute;top:52px;left:0;width:min(380px,calc(100vw - 32px));background:var(--card);border-radius:20px;box-shadow:var(--shadow-h);padding:6px;z-index:60;max-height:70vh;overflow:auto}
.ctx-l [role=option]{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;cursor:pointer}
.ctx-l [role=option][aria-selected="true"]{background:var(--acc-l)}
.ctx-l [role=option].hl{background:var(--sub)}
.fresh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);font-weight:600;padding:0 16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-l)}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.ibtn .pip{position:absolute;top:9px;right:9px;min-width:16px;height:16px;border-radius:999px;background:var(--bad-f);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.mob-only{display:none}

/* ---------- headers ---------- */
.vh{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin:6px 0 20px}
.vh h1{font-size:40px;line-height:1.08;letter-spacing:-.025em;font-weight:650;margin:0}
.vh p{margin:8px 0 0;color:var(--ink2);font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:700;font-size:13.5px;transition:transform .2s var(--ease),background .2s}
.btn.pri{background:var(--ink);color:var(--card)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--card);box-shadow:var(--shadow)}
.btn.ghost{background:var(--sub);}
.btn:hover{transform:translateY(-1px)}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}

/* ---------- grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s-12{grid-column:span 12}.s-3{grid-column:span 3}.r2{grid-row:span 2}.s-8{grid-column:span 8}.s-7{grid-column:span 7}.s-6{grid-column:span 6}.s-5{grid-column:span 5}.s-4{grid-column:span 4}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;position:relative;min-width:0;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .3s}
.card.hov:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.enter{animation:rise .38s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.ch h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.ch .k{font-size:12.5px;color:var(--ink3);margin-top:3px}
.go{width:34px;height:34px;border-radius:50%;background:var(--sub);display:grid;place-items:center;flex:none;transition:background .2s,transform .2s}
.go:hover{background:var(--acc);color:var(--acc-ink);transform:rotate(-8deg)}
.lbl-s{font-size:12.5px;color:var(--ink3);font-weight:600}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.kpi .top-r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .ic{width:38px;height:38px;border-radius:12px;background:var(--sub);display:grid;place-items:center}
.kpi .v{font-size:34px;font-weight:750;letter-spacing:-.02em;line-height:1}
.kpi .v small{font-size:16px;font-weight:650;color:var(--ink3);letter-spacing:0}
.kpi .f{font-size:12.5px;color:var(--ink2)}
.k-mini{container-type:inline-size;display:flex}
.k-mini .kpi{flex:1;justify-content:space-between;gap:clamp(10px,4cqw,18px)}
.k-mini .lbl-s{font-size:clamp(13px,3.6cqw,16px);color:var(--ink2)}
.k-mini .ic{width:clamp(38px,11cqw,48px);height:clamp(38px,11cqw,48px);border-radius:14px}
.k-mini .ic svg{width:clamp(18px,5.4cqw,24px);height:clamp(18px,5.4cqw,24px)}
.k-mini .v{font-size:clamp(34px,17cqw,76px);letter-spacing:-.035em}
.k-mini .v small{font-size:clamp(15px,5.4cqw,24px)}
.k-mini .f{font-size:clamp(12.5px,3.4cqw,15px)}
.kviz{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.kviz .bar{display:flex;height:clamp(10px,3.4cqw,14px);border-radius:999px;overflow:hidden;gap:3px;background:none}
.kviz .bar span{height:100%;border-radius:999px;transform-origin:left;animation:growx .55s var(--ease) both}
.kviz .lg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:clamp(11.5px,3cqw,13px);color:var(--ink2);font-weight:600}
.kviz .lg2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:5px 9px;font-size:clamp(11.5px,3cqw,13px);font-weight:700}
.dchip b{font-size:1.15em;margin-right:4px}
.feat{grid-row:span 2;color:#fff;background:none;box-shadow:none;display:flex;flex-direction:column}
.feat>*{position:relative;z-index:1}
.feat>.bgx{position:absolute;inset:0;z-index:0;border-radius:inherit;background:radial-gradient(120% 160% at 100% 0%,rgb(110 190 140/.55) 0%,transparent 45%),linear-gradient(135deg,#1C8549 0%,#137240 45%,#0B4A28 100%);clip-path:polygon(0 0,calc(100% - 62px) 0,calc(100% - 62px) 8px,calc(100% - 8px) 62px,100% 62px,100% 100%,0 100%);box-shadow:var(--shadow);overflow:hidden}

.feat .ch h2{color:#fff}.feat .ch .k{color:rgb(255 255 255/.82)}
.feat .corner{position:absolute;top:0;right:0;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;z-index:2;transition:transform .2s var(--ease)}
.feat .corner:hover{transform:rotate(-12deg) scale(1.05)}
.feat .ch{padding-right:56px}
.gauge{width:100%;max-width:320px;margin:4px auto 0;display:block}
.gz text{font-size:11px;font-weight:700;fill:#fff}
.needle{transform-origin:160px 160px;transition:transform .6s var(--ease)}
.gleg{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11.5px;font-weight:700;margin:2px 0 10px}.gleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.feat .big{font-size:46px;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1;margin-top:-6px}
.feat .why{font-size:12.5px;color:rgb(255 255 255/.88);text-align:center;margin-top:8px}
.feat .eq{margin-top:auto;background:rgb(255 255 255/.12);border-radius:16px;padding:12px 14px;font-size:12.5px;color:rgb(255 255 255/.92)}
.feat .pillw{display:flex;justify-content:center;margin-top:12px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke-width:2.2}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-neu{background:var(--neu-bg);color:var(--neu)}.p-acc{background:var(--acc-l);color:var(--acc)}
.p-pend{background:repeating-linear-gradient(45deg,var(--neu-bg) 0 5px,var(--sub) 5px 10px);color:var(--neu)}
.feat .pill{background:#fff;color:#8E1B12}

/* status bar */
.sbar{display:flex;height:44px;border-radius:14px;overflow:hidden;gap:3px}
.seg{height:100%;min-width:6px;position:relative;transition:filter .2s,transform .2s}
.seg:hover{filter:brightness(1.08)}
.c-cumplido{background:var(--ok-f)}
.c-vencido{background:var(--bad-f)}
.c-vpc{background:repeating-linear-gradient(45deg,var(--bad-f) 0 5px,color-mix(in oklab,var(--bad-f) 45%,var(--card)) 5px 10px)}
.c-porvencer{background:var(--warn-f)}
.c-enplazo{background:var(--neu-f)}
.c-sinfecha{background:repeating-linear-gradient(45deg,var(--pend-f) 0 4px,var(--sub2) 4px 8px)}
.c-pend{background:repeating-linear-gradient(45deg,var(--acc-m) 0 4px,var(--acc-l) 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:14px}
.lg{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:12px;background:var(--sub);font-size:12.5px;font-weight:600}
.lg:hover{background:var(--sub2)}
.sw-c{width:14px;height:14px;border-radius:5px;flex:none}
.lg b{font-variant-numeric:tabular-nums}

/* columns chart */
.cols{--g:8px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:var(--g);align-items:end;height:220px;padding-top:24px;position:relative}
.colb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer;border-radius:12px}
.cols .colb{gap:6px}.colb .stk{width:min(34px,100%);border-radius:999px 999px 10px 10px;overflow:hidden;display:flex;flex-direction:column-reverse;transform-origin:bottom;animation:grow .5s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.colb .stk>span{display:block}
.colb .val{font-size:12px;font-weight:700}
.colb .m{font-size:11.5px;color:var(--ink3);font-weight:600;white-space:nowrap}
.colb.past .m{color:var(--ink2)}
.colb.corte .m{color:var(--acc);font-weight:800}
.colb:hover .stk{filter:brightness(1.07)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.cutline{position:absolute;top:0;bottom:22px;border-left:2px dashed var(--acc);}
.cutline span{position:absolute;top:-2px;left:6px;font-size:11px;font-weight:800;color:var(--acc);white-space:nowrap}

/* bars by area */
.hb{display:flex;flex-direction:column;gap:6px}
.hbr{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 62px auto;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;width:100%}
.hbr:hover,.hbr.is-ctx{background:var(--sub)}
.hbr .nm{font-weight:650;font-size:13px;line-height:1.2}
.hbr .nm small{display:block;color:var(--ink3);font-weight:600;font-size:11.5px}
.trk{height:14px;border-radius:999px;position:relative;overflow:hidden;background:linear-gradient(90deg,var(--bad-bg) 0 var(--ua),var(--warn-bg) var(--ua) var(--uv),var(--ok-bg) var(--uv) 100%)}
.trk .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transform-origin:left;animation:growx .55s var(--ease) both;box-shadow:2px 0 0 var(--card)}
.trk .fill.z-Rojo{background:var(--bad-f)}.trk .fill.z-Amarillo{background:var(--warn-f)}.trk .fill.z-Verde{background:var(--ok-f)}.trk .fill.z-neu{background:var(--acc-m)}
.trk .fill.none{background:repeating-linear-gradient(45deg,var(--pend-f) 0 4px,transparent 4px 8px);width:100%!important}
.zleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-4px 0 12px;padding:0 10px;font-size:12px;font-weight:650;color:var(--ink2)}
.zleg i{display:inline-block;width:22px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
.hb-ax{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 62px auto;gap:12px;padding:0 10px;font-size:11px;color:var(--ink3);font-weight:700}
.hb-ax .sc{position:relative;height:14px}
.hb-ax .sc span{position:absolute;transform:translateX(-50%)}

/* alerts */
.next{background:var(--warn-bg);border-radius:18px;padding:16px;display:block;width:100%;text-align:left}
.next .d{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--warn)}
.next .t{font-weight:700;margin:6px 0 4px}
.next .s{font-size:12.5px;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px;border-radius:14px;width:100%;text-align:left}
.row.cmp{grid-template-columns:auto minmax(0,1fr) auto}
.row:hover,.row.is-sel{background:var(--sub)}
.row.is-sel{box-shadow:inset 0 0 0 2px var(--acc)}
.row .id{font-weight:800;font-size:12.5px}
.row .ti{font-weight:600;font-size:13px;line-height:1.3}
.row .su{font-size:12px;color:var(--ink3)}
.datebox{width:46px;height:46px;border-radius:14px;background:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.datebox b{font-size:16px}.datebox span{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;margin-top:3px}
.scroll{max-height:380px;overflow:auto;margin:0 -6px;padding:0 6px}

/* insights */
.ins{display:flex;gap:12px;text-align:left;width:100%;padding:12px;border-radius:16px;background:var(--sub);align-items:flex-start}
.ins:hover{background:var(--sub2)}
.ins .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--card)}
.ins p{margin:0;font-weight:600;font-size:13.5px;line-height:1.4}
.ins .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11.5px;color:var(--ink3);font-weight:600}

/* table */
.tw{overflow:auto;margin:0 -8px;padding:0 8px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
th button{display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
th[aria-sort] button{color:var(--ink)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover td{background:var(--sub)}
tbody tr.is-sel td{background:var(--acc-l)}
tbody tr:focus-visible{outline:none}
tbody tr:focus-visible td{box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
td.r,th.r{text-align:right}
td .b{font-weight:800}
.muted{color:var(--ink3)}
.sd{color:var(--ink3);font-style:italic;white-space:nowrap}
td.b{white-space:nowrap}
.bul{width:110px;height:10px;border-radius:999px;background:var(--sub2);position:relative}
.bul i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--acc)}
.bul em{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--ink)}

/* toolbar & chips */
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.chip .n{font-size:11.5px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.seg2{display:inline-flex;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:4px;gap:2px}
.seg2 button{height:30px;padding:0 14px;border-radius:999px;font-weight:650;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.fsearch{height:36px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 14px;min-width:220px}
.fsearch input{border:0;outline:0;background:none;width:100%}
.vis{font-size:12.5px;color:var(--ink3);font-weight:600;margin-left:auto}

/* area gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.acard{cursor:pointer;display:flex;flex-direction:column;gap:14px}
.acard .hd{display:flex;gap:12px;align-items:center}
.acard .hd h3{margin:0;font-size:15.5px;line-height:1.25}
.acard .hd p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.met{background:var(--sub);border-radius:14px;padding:10px 12px}
.met b{display:block;font-size:20px;font-weight:750;letter-spacing:-.01em}
.met span{font-size:11.5px;color:var(--ink3);font-weight:600}
.minibar{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px}
.acard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* timeline */
.tl{min-width:1040px;display:grid;grid-template-columns:170px repeat(13,minmax(56px,1fr)) 78px;position:relative}
.tl .hcell{font-size:11.5px;font-weight:700;color:var(--ink3);padding:6px 4px 10px;text-align:center;border-bottom:1px solid var(--line)}
.tl .hcell.corte{color:var(--acc)}
.tl .lab{padding:10px 8px;border-bottom:1px solid var(--line);font-weight:650;font-size:12.5px;line-height:1.25;display:flex;align-items:center}
.tl .lab small{display:block;color:var(--ink3);font-weight:600;font-size:11px}
.tl .cell{border-bottom:1px solid var(--line);padding:6px 3px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;min-height:52px}
.tl .cell.past{background:color-mix(in oklab,var(--sub) 60%,transparent)}
.tl .cell.cut{border-right:2px dashed var(--acc)}
.tl .cell.sf{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--sub) 6px 12px)}
.hc{height:24px;min-width:40px;padding:0 6px;border-radius:8px;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:#fff;transition:transform .15s var(--ease)}
.hc:hover{transform:translateY(-2px)}
.hc.cumplido{background:var(--ok-f);color:#04220F}
.hc.vencido{background:var(--bad-f)}
.hc.vpc{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad-f)}
.hc.porvencer{background:var(--warn-f);color:#2B1A00}
.hc.enplazo{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--neu-f)}
.hc.sinfecha{background:var(--sub2);color:var(--ink);box-shadow:inset 0 0 0 1.5px dashed var(--neu-f)}
.hc.is-sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.hc svg{width:11px;height:11px;stroke-width:2.6}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow:auto;padding-bottom:6px}
.bcol{background:var(--sub);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bcol h3{margin:2px 4px 2px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
.tcard{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard.is-sel{box-shadow:0 0 0 2px var(--acc)}
.tcard .tg{display:flex;justify-content:space-between;gap:6px;align-items:center}
.tcard .tag{font-size:11px;font-weight:800;color:var(--acc);background:var(--acc-l);border-radius:7px;padding:2px 7px}
.tcard .ti{font-weight:650;font-size:13px;line-height:1.3}
.tcard .ft{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);gap:6px;flex-wrap:wrap}
.empty{padding:16px;text-align:center;color:var(--ink3);font-size:12.5px;border:1.5px dashed var(--line);border-radius:14px}

/* pendientes */
.preq{display:flex;flex-direction:column;gap:14px}
.psec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;gap:8px;align-items:center}
.note{background:var(--sub);border-radius:14px;padding:12px 14px;font-size:13px}
.note+.note{margin-top:8px}

/* inspector */
.insp{position:fixed;top:12px;right:12px;bottom:12px;width:min(580px,calc(100vw - 24px));background:var(--card);border-radius:26px;box-shadow:0 30px 80px rgb(0 0 0/.22),0 2px 8px rgb(0 0 0/.08);z-index:80;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .4s var(--ease),width .35s var(--ease);visibility:hidden}
.insp.open{transform:none;visibility:visible}
.insp.wide{width:min(980px,calc(100vw - 24px))}
.scrim{position:fixed;inset:0;background:rgb(10 12 11/.28);z-index:70;opacity:0;transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.ih{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.ih .tp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ih .ty{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink3);text-transform:uppercase}
.ih h2{margin:8px 0 4px;font-size:22px;letter-spacing:-.015em;line-height:1.2}
.ih .su{color:var(--ink2);font-size:13px}
.ih .acts{display:flex;gap:6px}
.ib{padding:18px 22px 28px;overflow:auto;flex:1}
.ib h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}
.ib h3:first-child{margin-top:4px}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mk .met b{font-size:19px}
.fl{display:grid;grid-template-columns:minmax(130px,38%) 1fr;border-radius:16px;overflow:hidden;background:var(--sub)}
.fl dt,.fl dd{margin:0;padding:10px 12px;border-bottom:1px solid var(--card);font-size:13px}
.fl dt{color:var(--ink3);font-weight:650}
.fl dd{font-weight:600}
.statusbox{display:flex;gap:10px;align-items:flex-start;background:var(--sub);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:13px}
.stepper{display:flex;align-items:flex-start;gap:0;margin:6px 0 4px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;font-size:12px}
.st::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before{background:var(--acc)}
.st .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sub2);position:relative;z-index:1}
.st.done .c{background:var(--acc);color:var(--acc-ink)}
.st.cur .c{background:var(--card);box-shadow:0 0 0 3px var(--acc)}
.st.badc .c{background:var(--bad-f);color:#fff}
.st b{font-size:12px}.st span{color:var(--ink3);font-size:11.5px}

/* toasts */
.toasts{position:fixed;left:20px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#141615;color:#fff;border-radius:999px;padding:11px 18px 11px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgb(0 0 0/.25);animation:tin .3s var(--ease) both;pointer-events:auto}
.toast i{width:9px;height:9px;border-radius:50%;background:#3DD68C}
.toast.out{animation:tout .25s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--sub) 0,var(--sub2) 50%,var(--sub) 100%);background-size:200% 100%;animation:sh 1s linear infinite;border-radius:var(--r-card);min-height:150px}
@keyframes sh{to{background-position:-200% 0}}

::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .s-3,.s-4,.s-5{grid-column:span 6}.s-7,.s-8{grid-column:span 12}.r2{grid-row:auto}
  .feat{grid-column:span 12;grid-row:auto}
  .k-mini{grid-column:span 6}
}
@media (max-width:1040px){
  .shell{grid-template-columns:84px minmax(0,1fr)}
  .nav-h,.nav-b .lbl,.nav-b .badge,.side-card,.gen .lbl{display:none}
  .hero-t{display:none}
  .nav-b{justify-content:center;padding:0}
  .nav-b .badge.mob{display:inline-grid}
}
@media (max-width:768px){
  body{font-size:14px}
  .shell{display:block;margin:0;border-radius:0;min-height:100vh}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:50;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -6px 24px rgb(0 0 0/.08);border-radius:22px 22px 0 0;flex-direction:row}
  .gen-wrap{display:none}
  .hero{margin:0;padding:14px 16px;flex-wrap:wrap;gap:12px;border-radius:0}
  .hero-bg{border-radius:0 0 22px 22px;clip-path:none}
  .hero-logo{padding:3px;border-radius:11px}.hero-logo img{height:38px}
  .hero-r{display:contents}
  .tseg{margin-left:auto;padding:3px}.tseg button{width:32px;height:32px}
  .hero .ibtn{width:40px;height:40px}
  .hero .search{order:5;flex:1 1 100%;max-width:none;min-width:0}.hero .ctx{order:6;flex:1 1 100%}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav-ind{display:none}
  .nav-b{flex-direction:column;height:56px;gap:3px;padding:4px 6px;flex:1;border-radius:14px}
  .nav-b .lbl{display:block;font-size:10.5px;flex:none}
  .nav-b[aria-current="page"]{background:var(--acc-l);color:var(--acc)}
  .main{padding:16px 16px 110px}
  .mob-only{display:grid}
  .top{gap:8px}
  .search{flex-basis:100%;max-width:none}
  .ctx{flex:1 1 100%;min-width:0}.ctx>button{width:100%}.ctx .sm{overflow:hidden;text-overflow:ellipsis}
  .ctx>button>div{min-width:0;overflow:hidden}
  .fresh{display:none}
  .vh h1{font-size:30px}
  .grid{gap:14px}
  .s-4,.s-5,.s-6,.s-7,.s-8{grid-column:span 12}
  .k-mini,.s-3{grid-column:span 6}
  .card{padding:18px}
  .hbr{grid-template-columns:minmax(0,1fr) 58px auto;}
  .hbr .trk{grid-column:1/-1;grid-row:2}
  .cols{--g:4px}
  .colb .m{font-size:10px}
  .insp,.insp.wide{top:0;right:0;bottom:0;width:100vw;border-radius:0}
  .toasts{left:12px;right:12px;bottom:88px}
  .fsearch{min-width:0;flex:1 1 100%}
  .vis{margin-left:0}
  .fl{grid-template-columns:1fr}
  .row{grid-template-columns:auto minmax(0,1fr) auto}.row>.pill{grid-column:2;grid-row:2;justify-self:start}.row>svg{grid-column:3;grid-row:1/span 2}
  .fl dt{border-bottom:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
</style>

function calcKpi(k, area) {
  const vals = k.m.slice(0, MESCORTE).filter(x => x !== null && x !== '' && x !== undefined);
  let real = null;
  if (vals.length) {
    if (k.agr === 'Suma') real = vals.reduce((a, b) => a + b, 0);
    else if (k.agr === 'Promedio') real = vals.reduce((a, b) => a + b, 0) / vals.length;
    else real = vals[vals.length - 1];
  }
  let p = null, estado;
  const hasMeta = !(k.meta === null || k.meta === '' || k.meta === undefined) && k.metaFecha != null;
  if (!hasMeta) estado = 'Sin meta';
  else if (real === null) estado = 'Sin dato';
  else {
    p = k.sent === 'Menor' ? (real === 0 ? 1 : k.metaFecha / real) : (k.metaFecha === 0 ? 1 : real / k.metaFecha);
    estado = p >= DATA.umbVerde ? 'Verde' : p >= DATA.umbAmarillo ? 'Amarillo' : 'Rojo';
  }
  return {...k, area, real, pct: p, estado, T: 'kpi'};
}
function calcHito(h, area) {
  const f = pd(h.fecha), fr = pd(h.fechaReal);
  let c, atraso = null, dias = null;
  if (f) dias = Math.round((f - CORTE) / DAY);
  if (h.estado === 'Cerrado') {
    if (f && fr) { c = fr <= f ? 'Cumplido a tiempo' : 'Cumplido tarde'; atraso = Math.max(0, Math.round((fr - f) / DAY)); }
    else c = 'Cumplido';
  } else if (!f) c = 'Sin fecha';
  else if (f < CORTE) { c = h.estado === 'Por confirmar' ? 'Vencido (por confirmar)' : 'Vencido'; atraso = Math.round((CORTE - f) / DAY); }
  else if ((f - CORTE) / DAY <= DATA.diasPorVencer) { c = 'Por vencer'; atraso = 0; }
  else { c = 'En plazo'; atraso = 0; }
  const g = c.startsWith('Cumplido') ? 'cumplido' : c.startsWith('Vencido') ? 'vencido' : c === 'Por vencer' ? 'porvencer' : c === 'En plazo' ? 'enplazo' : 'sinfecha';
  const cls = c === 'Vencido (por confirmar)' ? 'vpc' : g;
  return {...h, area, cumpl: c, atraso, dias, g, cls, T: 'hito'};
}
function summarize(kpis, hitos) {
  const s = {n: kpis.length, verde: 0, amarillo: 0, rojo: 0, sindato: 0, sinmeta: 0, h: hitos.length, cumpl: 0, venc: 0, vpc: 0, porv: 0, enpl: 0, sinf: 0, bloq: 0};
  kpis.forEach(k => { s[{Verde:'verde',Amarillo:'amarillo',Rojo:'rojo','Sin dato':'sindato','Sin meta':'sinmeta'}[k.estado]]++; });
  hitos.forEach(h => { s[{cumplido:'cumpl',vencido:'venc',porvencer:'porv',enplazo:'enpl',sinfecha:'sinf'}[h.g]]++; if (h.cls === 'vpc') s.vpc++; if (h.estado === 'Bloqueado') s.bloq++; });
  s.medidos = s.verde + s.amarillo + s.rojo;
  s.alDia = (s.cumpl + s.venc) ? s.cumpl / (s.cumpl + s.venc) : null;
  s.num = s.verde + .5 * s.amarillo + s.cumpl;
  s.den = s.medidos + s.cumpl + s.venc;
  s.idx = s.den ? s.num / s.den : null;
  s.pVerde = s.medidos ? s.verde / s.medidos : null;
  if (s.medidos === 0 && s.venc === 0) s.sem = 'Sin KPIs medidos';
  else if (s.idx >= DATA.umbAmarillo && s.rojo === 0 && s.venc === 0) s.sem = 'Verde';
  else if (s.idx >= DATA.umbArea) s.sem = 'Amarillo';
  else s.sem = 'Rojo';

}
function semWhy(s) {
  if (s.sem === 'Sin KPIs medidos') return 'El área no ha reportado ningún KPI medible y no tiene hitos vencidos.';
  const r = [];
  r.push(`Índice ${s.idx == null ? 'sin dato' : pct(s.idx)}`);
  if (s.sem === 'Rojo') r[0] += ` (por debajo del ${pct(DATA.umbArea)})`;
  if (s.venc) r.push(plural(s.venc, 'hito vencido', 'hitos vencidos'));
  if (s.rojo) r.push(plural(s.rojo, 'KPI en rojo', 'KPIs en rojo'));
  if (s.sem === 'Verde') r.push('sin KPIs en rojo ni hitos vencidos');
  return r.join(' · ') + '.';
}

function card(inner, cls = '', i = 0, attrs = '') { return `<div class="card enter ${cls}" style="--i:${i}" ${attrs}>${inner}</div>`; }
function head(title, sub, openKey, label) {
  return `<div class="ch"><div><h2>${title}</h2>${sub ? `<div class="k">${sub}</div>` : ''}</div>${openKey ? `<button class="go" data-open="${openKey}" aria-label="Ver detalle completo: ${esc(label || title)}">${ic('up')}</button>` : ''}</div>`;
}
function hitoRow(h, showArea = true, compact = false) {
  const d = pd(h.fecha);
  return `<button class="row ${compact ? 'cmp' : ''}" data-open="hito:${h.id}">
    <span class="datebox">${d ? `<b>${d.getDate()}</b><span>${MES[d.getMonth()]}${d.getFullYear() !== 2026 ? ' ' + String(d.getFullYear()).slice(2) : ''}</span>` : `<b>—</b><span>s/f</span>`}</span>
    <span><span class="ti">${esc(h.hito)}</span><br><span class="su"><b class="id">${h.id}</b>${showArea ? ' · ' + esc(AMAP[h.area].corto) : ''} · ${esc(h.resp || 'Sin responsable')}</span></span>
    ${compact ? '' : pill(h.cumpl === 'Vencido (por confirmar)' ? 'Por confirmar' : h.cumpl, h.cls)}
    ${ic('chev')}
  </button>`;
}

/* ===================== vistas ===================== */
const VIEWS = [
  {id: 'resumen', l: 'Resumen', i: 'dash'},
  {id: 'areas', l: 'Áreas', i: 'bld'},
  {id: 'hitos', l: 'Hitos', i: 'flag'},
  {id: 'kpis', l: 'Indicadores', i: 'target'},
  {id: 'pedir', l: 'Por pedir', i: 'clip'}
];
if (DATA.solo) VIEWS.splice(VIEWS.findIndex(v => v.id === 'areas'), 1);
function pendCount(sc) {
  const k = sc.kpis.filter(k => k.estado === 'Sin dato' || k.estado === 'Sin meta').length;
  return sc.areas.reduce((n, a) => n + Object.values(pedirFor(a)).reduce((x, arr) => x + arr.length, 0), 0);
}

function vResumen() {
  const sc = scope(), s = sc.s, H = sc.hitos;
  const venc = H.filter(h => h.g === 'vencido'), porv = H.filter(h => h.g === 'porvencer').sort((a, b) => a.fecha.localeCompare(b.fecha));
  const cumpl = H.filter(h => h.g === 'cumplido');
  const noMed = sc.kpis.filter(k => !['Verde', 'Amarillo', 'Rojo'].includes(k.estado));
  const med = sc.kpis.filter(k => ['Verde', 'Amarillo', 'Rojo'].includes(k.estado));
  const title = sc.all ? 'Plan Estratégico 2026' : esc(sc.name);
  const sub = sc.all ? `Cómo va el plan al corte del ${fd(DATA.corte)}: qué se cumplió, qué se venció y qué vence pronto.` : `Líder: ${esc(sc.area.lider)} · el plan de esta área al corte del ${fd(DATA.corte)}.`;
  let o = `<div class="vh"><div><h1>${title}</h1><p>${sub}</p></div>${sc.all || DATA.solo ? '' : `<button class="btn sec" data-ctx="ALL">${ic('back')}Volver al consolidado</button>`}</div><div class="grid">`;
  // gauge
  const t = s.idx == null ? 0 : Math.max(0, Math.min(1, s.idx));
  o += card(`<span class="bgx" aria-hidden="true"></span>${head(sc.all ? 'Índice del plan' : 'Índice del área', '¿En qué zona está el cumplimiento?')}
    <button class="corner" data-open="index" aria-label="Ver cómo se calcula el índice, área por área">${ic('up')}</button>
    ${gauge(t)}
    <div class="gleg" aria-hidden="true"><span><i style="background:#FF8A80"></i>Rojo &lt; ${pct(DATA.umbArea)}</span><span><i style="background:#FFD166"></i>Amarillo</span><span><i style="background:#7CE0A3"></i>Verde ≥ ${pct(DATA.umbAmarillo)}</span></div>
    <div class="big num">${s.idx == null ? 'Sin dato' : cnt('idx', s.idx, 'pct') + '<span style="font-size:24px"> %</span>'}</div>
    <div class="pillw">${pill('Semáforo: ' + s.sem, s.sem)}</div>
    <div class="why">${esc(semWhy(s))}</div>
    <div class="eq num">(${nfa(s.verde)} KPIs en verde + ½ × ${nfa(s.amarillo)} en amarillo + ${nfa(s.cumpl)} hitos cumplidos) ÷ (${nfa(s.medidos)} KPIs medidos + ${nfa(s.cumpl + s.venc)} hitos que ya vencían) = <b>${nfa(Math.round(s.num * 10) / 10)} ÷ ${nfa(s.den)}</b></div>`, 'feat s-4', 0);
  const bar = parts => { const t = parts.reduce((a, p) => a + p.n, 0) || 1; return `<span class="bar" aria-hidden="true">${parts.filter(p => p.n).map(p => `<span class="c-${p.c}" style="flex:${p.n}"></span>`).join('')}</span><span class="lg2">${parts.filter(p => p.n).map(p => `<span><i class="c-${p.c}"></i>${nf(p.n)} ${sg(p.n, p.l)}</span>`).join('')}</span>`; };
  const byDate = {}; porv.forEach(h => byDate[h.fecha] = (byDate[h.fecha] || 0) + 1);
  const VZ = {
    c: bar([{c: 'cumplido', n: s.cumpl, l: 'cumplidos'}, {c: 'sinfecha', n: s.h - s.cumpl, l: 'por cumplir'}]),
    v: s.venc ? bar([{c: 'vencido', n: s.venc - s.vpc, l: 'vencidos'}, {c: 'vpc', n: s.vpc, l: 'por confirmar'}]) : '',
    p: porv.length ? `<span class="dchips">${Object.keys(byDate).sort().map(d => `<span class="dchip"><b class="num">${byDate[d]}</b>${d === DATA.corte ? 'al corte' : 'el ' + fd(d).replace(' 2026', '')}</span>`).join('')}</span>` : '',
    m: bar([{c: 'cumplido', n: s.medidos, l: 'medidos'}, {c: 'enplazo', n: s.sindato, l: 'sin dato'}, {c: 'sinfecha', n: s.sinmeta, l: 'sin meta'}])
  };
  const mini = (i, icn, val, small, f, key, label, tone, vz) => card(`<button class="kpi" data-open="${key}" aria-label="${esc(label)}: ver la lista completa">
      <span class="top-r"><span class="lbl-s">${label}</span><span class="ic" style="${tone ? `color:var(--${tone})` : ''}">${ic(icn)}</span></span>
      <span style="display:flex;flex-direction:column;gap:6px"><span class="v">${val}${small ? ` <small>${small}</small>` : ''}</span><span class="f">${f}</span></span><span class="kviz">${VZ[vz] || ''}</span></button>`, 'hov k-mini s-4', i);
  o += mini(1, 'check', cnt('c', s.cumpl), `de ${nf(s.h)}`, `${pct(s.h ? s.cumpl / s.h : null)} de los hitos del año`, lk('Hitos cumplidos', cumpl), 'Hitos cumplidos', 'ok', 'c');
  o += mini(2, 'alert', cnt('v', s.venc), '', s.venc ? `La fecha pasó y no están cerrados` : 'Ningún hito vencido', lk('Hitos vencidos', venc.sort((a, b) => b.atraso - a.atraso)), 'Hitos vencidos', 'bad', 'v');
  o += mini(3, 'clock', cnt('p', s.porv), '', `Vencen en los próximos ${DATA.diasPorVencer} días, por fecha:`, lk(`Hitos por vencer (≤${DATA.diasPorVencer} días)`, porv), 'Por vencer', 'warn', 'p');
  o += mini(4, 'target', cnt('m', s.medidos), `de ${nf(s.n)}`, `Indicadores con meta y valor real`, lk('Indicadores', sc.kpis), 'KPIs medidos', 'acc', 'm');

  // status bar
  const total = H.length || 1;
  const segs = SEGS.map(g => ({...g, items: H.filter(g.f)})).filter(g => g.items.length);
  const ratio = s.cumpl ? s.venc / s.cumpl : null;
  const t1 = !H.length ? 'Sin hitos registrados' : s.venc > s.cumpl ? (s.cumpl ? `Hay ${nfa(Math.round(ratio * 10) / 10)} hitos vencidos por cada uno cumplido` : `${plural(s.venc, 'hito vencido', 'hitos vencidos')} y ninguno cumplido`) : `${plural(s.cumpl, 'hito cumplido', 'hitos cumplidos')} y ${plural(s.venc, 'vencido', 'vencidos')}`;
  o += card(`${head(t1, `Estado de los ${nf(H.length)} hitos al ${fd(DATA.corte)}`, lk('Todos los hitos', H), 'todos los hitos')}
    <div class="sbar" role="list">${segs.map(g => `<button role="listitem" class="seg c-${g.cls}" style="flex:${g.items.length}" data-open="${lk(g.l, g.items)}" aria-label="${g.l}: ${g.items.length} de ${H.length}" title="${g.l}: ${g.items.length}"></button>`).join('')}</div>
    <div class="legend">${segs.map(g => `<button class="lg" data-open="${lk(g.l, g.items)}"><span class="sw-c c-${g.cls}"></span>${g.l} <b>${g.items.length}</b><span class="muted">${pct(g.items.length / total)}</span></button>`).join('')}</div>`, 's-8', 5);

  // alerts
  const first = porv[0];
  const oldest = [...venc].sort((a, b) => b.atraso - a.atraso)[0];
  o += card(`${head('Vence pronto', porv.length ? `${plural(porv.length, 'hito', 'hitos')} en los próximos ${DATA.diasPorVencer} días` : 'Nada vence en los próximos 30 días', porv.length ? lk('Hitos por vencer', porv) : null, 'hitos por vencer')}
    ${first ? `<button class="next" data-open="hito:${first.id}"><div class="d num">${first.dias === 0 ? 'Vence en el corte' : `En ${plural(first.dias, 'día', 'días')}`}</div><div class="t">${esc(first.hito)}</div><div class="s"><b>${first.id}</b> · ${esc(AMAP[first.area].corto)} · ${esc(first.resp)} · ${fd(first.fecha)}</div></button>` :
      oldest ? `<button class="next" style="background:var(--bad-bg)" data-open="hito:${oldest.id}"><div class="d num" style="color:var(--bad)">${plural(oldest.atraso, 'día', 'días')} de atraso</div><div class="t">${esc(oldest.hito)}</div><div class="s"><b>${oldest.id}</b> · ${esc(oldest.resp)} · ${fd(oldest.fecha)}</div></button>` : '<div class="empty">Sin hitos pendientes con fecha.</div>'}
    <div class="scroll list" style="margin-top:10px">${porv.slice(1).map(h => hitoRow(h, sc.all, true)).join('')}</div>`, 's-4 r2', 6);

  // by month
  o += card(monthChart(H), 's-8', 7);

  // index by area
  o += card(DATA.solo ? frenteBars(sc) : areaBars(), 's-7', 8);
  // insights
  o += card(`${head('Insights', 'Hallazgos calculados con los datos del corte')}<div class="list" style="gap:8px">${insights(sc).map(x => `<button class="ins" data-open="${x.open}"><span class="ic" style="color:var(--${x.tone})">${ic(x.icon)}</span><span><p>${x.text}</p><span class="meta"><span>Dato: ${x.dato}</span><span>Periodo: corte ${fd(DATA.corte)}</span><span>Confianza: ${x.conf}</span></span></span></button>`).join('')}</div>`, 's-5', 9);

  // metas corporativas / KPIs del área
  if (sc.all) {
    const rows = DATA.metas.map(m => {
      const k = m.kpi ? KMAP[m.kpi] : null;
      const key = k ? `kpi:${k.id}` : 'meta-pend';
      return `<tr tabindex="0" data-open="${key}"><td><span class="pill p-neu">${esc(m.persp)}</span></td><td><b>${esc(m.ind)}</b>${k ? `<br><span class="muted">${k.id}</span>` : ''}</td><td>${esc(m.lider)}</td>
      <td class="r num">${k ? fv(k.meta, k.und) : '—'}</td><td class="r num">${k ? fv(k.metaFecha, k.und) : '—'}</td><td class="r num">${k ? fv(k.real, k.und) : '—'}</td><td class="r num">${k ? pct(k.pct) : '—'}</td><td>${pill(k ? k.estado : m.estado, k ? k.estado : 'Sin meta')}</td></tr>`;
    }).join('');
    const medidas = DATA.metas.filter(m => m.kpi && ['Verde', 'Amarillo', 'Rojo'].includes(KMAP[m.kpi].estado)).length;
    o += card(`${head(medidas ? `${medidas} de ${DATA.metas.length} metas corporativas tienen dato` : `Ninguna de las ${DATA.metas.length} metas corporativas tiene dato real todavía`, 'Norte 2026 y Cuadro de Mando Integral · real a la fecha de corte', lk('Metas corporativas', DATA.metas.filter(m => m.kpi).map(m => KMAP[m.kpi])), 'metas corporativas')}
      <div class="tw"><table><thead><tr><th>Perspectiva</th><th>Indicador</th><th>Líder</th><th class="r">Meta anual</th><th class="r">Meta a la fecha</th><th class="r">Real</th><th class="r">% cumpl.</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`, 's-12', 10);
  } else {
    o += card(`${head(med.length ? `${med.length} de ${sc.kpis.length} indicadores se pueden medir` : `Ninguno de los ${sc.kpis.length} indicadores se puede medir todavía`, 'Indicadores del área · meta, real y cumplimiento al corte', lk('Indicadores del área', sc.kpis), 'indicadores del área')}${kpiTable(sc.kpis, false)}`, 's-12', 10);
  }
  return o + '</div>';
}

function gauge(t) {
  const cx = 160, cy = 160, r = 116;
  const P = u => { const a = Math.PI * (1 - u); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (a, b) => { const [x1, y1] = P(a), [x2, y2] = P(b); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const ua = DATA.umbArea, uv = DATA.umbAmarillo;
  const lab = (u, txt) => { const a = Math.PI * (1 - u), x = cx + (r + 22) * Math.cos(a), y = cy - (r + 22) * Math.sin(a); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${txt}</text>`; };
  const deg = -90 + 180 * t;
  return `<svg class="gauge" viewBox="-10 0 340 176" role="img" aria-label="Velocímetro: índice ${pct(t)}. Zonas: Rojo por debajo de ${pct(ua)}, Amarillo de ${pct(ua)} a ${pct(uv)}, Verde desde ${pct(uv)}.">
    <g fill="none" stroke-width="20">
      <path d="${arc(0, ua - .004)}" stroke="#FF8A80" opacity=".95"/>
      <path d="${arc(ua + .004, uv - .004)}" stroke="#FFD166"/>
      <path d="${arc(uv + .004, 1)}" stroke="#7CE0A3"/>
    </g>
    <g class="gz">${lab(0, '0')}${lab(ua, pct(ua))}${lab(uv, pct(uv))}${lab(1, '100')}</g>
    <g class="needle" data-deg="${deg}" style="transform:rotate(-90deg)"><path d="M${cx - 5} ${cy} L${cx} ${cy - r + 18} L${cx + 5} ${cy} Z" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="10" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="4" fill="#006F32"/></g>
  </svg>`;
}

function monthChart(H) {
  const buckets = [];
  for (let m = 0; m < 12; m++) buckets.push({l: MESC[m], y: 2026, m, items: []});
  const extra = {};
  const sf = {l: 'Sin fecha', items: [], sf: true};
  H.forEach(h => {
    const d = pd(h.fecha);
    if (!d) { sf.items.push(h); return; }
    if (d.getFullYear() === 2026) buckets[d.getMonth()].items.push(h);
    else { const k = d.getFullYear() * 12 + d.getMonth(); (extra[k] = extra[k] || {l: MESC[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), y: d.getFullYear(), m: d.getMonth(), items: []}).items.push(h); }
  });
  const all = [...buckets, ...Object.keys(extra).sort().map(k => extra[k]), sf];
  const max = Math.max(1, ...all.map(b => b.items.length));
  const open = H.filter(h => h.g === 'porvencer' || h.g === 'enplazo');
  const top = [...all].filter(b => !b.sf).sort((a, b) => b.items.filter(h => open.includes(h)).length - a.items.filter(h => open.includes(h)).length)[0];
  const topOpen = top ? top.items.filter(h => open.includes(h)).length : 0;
  const title = topOpen ? `${MESL[top.m][0].toUpperCase() + MESL[top.m].slice(1)}${top.y !== 2026 ? ' ' + top.y : ''} concentra ${topOpen} de los ${open.length} hitos que faltan por vencer` : 'Hitos por mes de compromiso';
  const colsN = all.length;
  const cutIdx = MESCORTE; // después de la columna del mes de corte
  const bars = all.map((b, i) => {
    const n = b.items.length, hgt = n ? Math.max(8, n / max * 150) : 0;
    const parts = SEGS.map(g => ({cls: g.cls, n: b.items.filter(g.f).length})).filter(p => p.n);
    const lbl = `${b.sf ? 'Sin fecha' : (MESL[b.m] + ' ' + b.y)}: ${n} hitos` + (parts.length ? ' — ' + parts.map(p => `${p.n} ${SEGS.find(s => s.cls === p.cls).l.toLowerCase()}`).join(', ') : '');
    const past = !b.sf && (b.y < CORTE.getFullYear() || (b.y === CORTE.getFullYear() && b.m < CORTE.getMonth()));
    const isCut = !b.sf && b.y === CORTE.getFullYear() && b.m === CORTE.getMonth();
    return `<button class="colb ${past ? 'past' : ''} ${isCut ? 'corte' : ''}" style="--i:${i}" ${n ? `data-open="${lk(`Hitos de ${b.sf ? 'sin fecha' : MESL[b.m] + ' ' + b.y}`, b.items)}"` : 'disabled'} aria-label="${esc(lbl)}">
      <span class="val num">${n || ''}</span>
      <span class="stk" style="height:${hgt}px">${parts.map(p => `<span class="c-${p.cls}" style="height:${p.n / n * 100}%"></span>`).join('')}</span>
      <span class="m">${b.l}</span></button>`;
  }).join('');
  return `${head(title, 'Hitos por mes de compromiso, coloreados por cumplimiento al corte')}
    <div style="position:relative"><div class="cols" style="grid-template-columns:repeat(${colsN},minmax(0,1fr))">${bars}
    <span class="cutline" style="left:calc((100% - ${colsN - 1} * var(--g)) * ${cutIdx} / ${colsN} + ${cutIdx} * var(--g) - var(--g) / 2 - 1px)" aria-hidden="true"><span>Corte</span></span></div></div>
    <div class="legend">${SEGS.map(g => `<span class="lg" style="background:none;padding:0 6px 0 0"><span class="sw-c c-${g.cls}"></span>${g.l}</span>`).join('')}</div>`;
}

function frenteBars(sc) {
  const fr = [];
  const add = n => { n = n || 'Sin frente'; let f = fr.find(x => x.n === n); if (!f) fr.push(f = {n, h: [], k: []}); return f; };
  sc.hitos.forEach(h => add(h.frente).h.push(h)); sc.kpis.forEach(k => add(k.obj).k.push(k));
  const worst = [...fr].sort((a, b) => b.h.filter(h => h.g === 'vencido').length - a.h.filter(h => h.g === 'vencido').length)[0];
  const wv = worst ? worst.h.filter(h => h.g === 'vencido').length : 0;
  const title = wv ? `El frente «${worst.n}» concentra ${plural(wv, 'hito vencido', 'hitos vencidos')} del área` : 'Ningún frente tiene hitos vencidos';
  return `${head(title, 'Frentes del área: hitos por cumplimiento e indicadores medidos')}
    <div class="hb">${fr.map(f => { const med = f.k.filter(k => ['Verde', 'Amarillo', 'Rojo'].includes(k.estado)).length; const segs = SEGS.map(g => ({...g, n: f.h.filter(g.f).length})).filter(g => g.n);
      return `<button class="hbr" style="grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto" data-open="${lk('Frente ' + f.n, [...f.h, ...f.k])}" aria-label="${esc(f.n)}: ${f.h.length} hitos, ${f.k.length} indicadores, ${med} medidos">
      <span class="nm">${esc(f.n)}<small>${plural(f.h.length, 'hito', 'hitos')} · ${plural(f.k.length, 'KPI', 'KPIs')}</small></span>
      <span>${f.h.length ? `<span class="minibar" style="height:14px">${segs.map(g => `<span class="c-${g.cls}" style="flex:${g.n}"></span>`).join('')}</span><span class="lbl-s" style="display:block;margin-top:5px">${segs.map(g => `${g.n} ${sg(g.n, g.l.toLowerCase())}`).join(' · ')}</span>` : '<span class="lbl-s">Sin hitos</span>'}</span>
      <span class="pill ${med ? 'p-ok' : 'p-neu'}">${ic(med ? 'check' : 'dashed')}${med}/${f.k.length} KPIs medidos</span></button>`; }).join('')}</div>
    <div class="legend">${SEGS.map(g => `<span class="lg" style="background:none;padding:0 6px 0 0"><span class="sw-c c-${g.cls}"></span>${g.l}</span>`).join('')}</div>`;
}
function areaBars() {
  const rows = [...AREAS].sort((a, b) => (b.s.idx ?? -1) - (a.s.idx ?? -1));
  const ua = DATA.umbArea * 100, uv = DATA.umbAmarillo * 100;
  const best = rows[0], worst = rows.filter(a => a.s.idx != null).slice(-1)[0];
  const zero = rows.filter(a => a.s.idx === 0).length;
  const title = zero > 1 ? `${zero} áreas tienen índice 0 %: ningún hito vencido se cumplió` : `${best.corto} lidera; ${worst.corto} va de última`;
  return `${head(title, 'Índice por área · la barra toma el color de su semáforo; el fondo muestra las zonas', 'index', 'índice por área')}
    <div class="zleg"><span><i style="background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad-f)"></i>Zona roja · menos de ${pct(DATA.umbArea)}</span><span><i style="background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-f)"></i>Zona amarilla · ${pct(DATA.umbArea)} a ${pct(DATA.umbAmarillo)}</span><span><i style="background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-f)"></i>Zona verde · ${pct(DATA.umbAmarillo)} o más</span></div>
    <div class="hb" style="--ua:${ua}%;--uv:${uv}%">${rows.map((a, i) => `<button class="hbr ${S.ctx === a.id ? 'is-ctx' : ''}" data-open="area:${a.id}" aria-label="${esc(a.nombre)}: índice ${a.s.idx == null ? 'sin dato' : pct(a.s.idx)}, semáforo ${a.s.sem}">
      <span class="nm">${esc(a.corto)}<small>${esc(a.lider)}</small></span>
      <span class="trk"><span class="fill ${a.s.idx == null ? 'none' : ['Rojo', 'Amarillo', 'Verde'].includes(a.s.sem) ? 'z-' + a.s.sem : 'z-neu'}" style="width:${(a.s.idx ?? 0) * 100}%;animation-delay:${i * 40}ms"></span></span>
      <span class="num" style="font-weight:800;text-align:right">${a.s.idx == null ? '<span class="sd">Sin dato</span>' : pct(a.s.idx)}</span>

async function copy(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch (e2) { toast('No se pudo copiar'); } ta.remove(); }
}
function applyTheme() {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
  $$('[data-theme-set]').forEach(b => b.setAttribute('aria-checked', (S.theme || 'system') === b.dataset.themeSet));
  return dark;
}

/* ===================== eventos ===================== */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ctx]'); if (c) { e.stopPropagation(); setCtx(c.dataset.ctx); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const a = AMAP[cp.dataset.copy]; copy(pedirText(a), `Solicitud de ${a.corto} copiada`); return; }
  if (e.target.closest('#copyAll')) { copy(scope().areas.map(pedirText).join('\n\n———\n\n'), 'Solicitudes de todas las áreas copiadas'); return; }
  const o = e.target.closest('[data-open]'); if (o) { openObj(o.dataset.open); return; }
  const v = e.target.closest('[data-view]'); if (v) { go(v.dataset.view); return; }
  const af = e.target.closest('[data-af]'); if (af) { flipRender(() => { S.af = af.dataset.af; render(); }); toast(af.dataset.af === 'all' ? 'Todas las áreas' : `Áreas en «${af.dataset.af}»`); return; }
  const hf = e.target.closest('[data-hf]'); if (hf) { flipRender(() => { S.hf = hf.dataset.hf; render(); }); toast(`${plural(hitoFiltered(scope()).length, 'hito', 'hitos')} ${hf.dataset.hf === 'all' ? 'en total' : GDEF.find(g => g.k === hf.dataset.hf).l.toLowerCase()}`); return; }
  const hm = e.target.closest('[data-hm]'); if (hm) { S.hmode = hm.dataset.hm; render(); return; }
  const kf = e.target.closest('[data-kf]'); if (kf) { S.kf = kf.dataset.kf; render(); toast(`Indicadores: ${kf.dataset.kf === 'all' ? 'todos' : kf.dataset.kf.toLowerCase()}`); return; }
  const so = e.target.closest('[data-sort]'); if (so) { const [kind, k] = so.dataset.sort.split(':'); const st = kind === 'h' ? S.hsort : S.ksort; st.d = st.k === k ? -st.d : 1; st.k = k; render(); return; }
  if (e.target.closest('#iClose') || e.target.id === 'scrim') { closeInsp(); return; }
  if (e.target.closest('#iBack')) { STACK.pop(); openObj(STACK[STACK.length - 1], false); return; }
  if (e.target.closest('#iWide')) { $('#insp').classList.toggle('wide'); return; }
  if (e.target.closest('#btnMetodo,#btnMetodo2')) { openObj('metodo'); return; }
  const ts = e.target.closest('[data-theme-set]'); if (ts) { const v = ts.dataset.themeSet; S.theme = v === 'system' ? null : v; try { v === 'system' ? localStorage.removeItem('pe26-theme') : localStorage.setItem('pe26-theme', v); } catch (er) {} applyTheme(); toast({system: 'Apariencia según el sistema', light: 'Modo claro activado', dark: 'Modo oscuro activado'}[v]); return; }
  if (e.target.closest('#bell')) { S.hf = 'porvencer'; S.view === 'hitos' ? render() : go('hitos'); toast('Hitos por vencer en los próximos 30 días'); return; }
  if (e.target.closest('#ctxBtn')) { toggleCtx(); return; }
  const opt = e.target.closest('[data-ctxopt]'); if (opt) { toggleCtx(false); setCtx(opt.dataset.ctxopt); return; }
  if (!e.target.closest('#ctx')) toggleCtx(false);
  if (!e.target.closest('#searchBox')) showRes(false);
});
function applyThemeState() { return S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#insp').classList.contains('open')) { closeInsp(); return; } toggleCtx(false); showRes(false); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Enter' || e.key === ' ') {
    const t = e.target.closest('tr[data-open],[role="button"][data-open]');
    if (t && e.target === t) { e.preventDefault(); openObj(t.dataset.open); return; }
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('tbody tr')) {
    e.preventDefault(); const tr = e.target.closest('tr'); const n = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling; n?.focus();
  }
  if ($('#insp').classList.contains('open') && e.key === 'Tab') {
    const f = $$('#insp button, #insp [tabindex="0"]').filter(x => x.offsetParent !== null); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'aq' || id === 'hq' || id === 'kq') {
    const pos = e.target.selectionStart; S[id] = e.target.value;
    clearTimeout(window.__t); window.__t = setTimeout(() => { flipRender(render); const el = $('#' + id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 140);
  }
  if (id === 'q') searchRes(e.target.value);
});

/* contexto (listbox) */
let ctxHl = -1;
function toggleCtx(force) {
  const l = $('#ctxList'), b = $('#ctxBtn'); const open = force ?? l.hidden;
  l.hidden = !open; b.setAttribute('aria-expanded', open);
  if (open) { const opts = $$('[role=option]', l); ctxHl = opts.findIndex(o => o.getAttribute('aria-selected') === 'true'); hlCtx(opts); l.focus(); }
}
function hlCtx(opts) { opts.forEach((o, i) => o.classList.toggle('hl', i === ctxHl)); if (opts[ctxHl]) { $('#ctxList').setAttribute('aria-activedescendant', opts[ctxHl].id); opts[ctxHl].scrollIntoView({block: 'nearest'}); } }
$('#ctxList').addEventListener('keydown', e => {
  const opts = $$('[role=option]', $('#ctxList'));
  if (e.key === 'ArrowDown') { e.preventDefault(); ctxHl = Math.min(opts.length - 1, ctxHl + 1); hlCtx(opts); }
  if (e.key === 'ArrowUp') { e.preventDefault(); ctxHl = Math.max(0, ctxHl - 1); hlCtx(opts); }
  if (e.key === 'Enter' && opts[ctxHl]) { e.preventDefault(); toggleCtx(false); $('#ctxBtn').focus(); setCtx(opts[ctxHl].dataset.ctxopt); }
  if (e.key === 'Escape') { toggleCtx(false); $('#ctxBtn').focus(); }
});

/* búsqueda global */
let RES = [], resHl = 0;
function searchRes(q) {
  q = q.trim().toLowerCase();
  if (!q) { showRes(false); return; }
  const m = (s) => s.toLowerCase().includes(q);
  RES = [
    ...AREAS.filter(a => m(a.nombre + ' ' + a.lider + ' ' + a.id)).map(a => ({key: 'area:' + a.id, ty: 'ÁREA', t: a.nombre, s: a.lider})),
    ...ALLH.filter(h => m(h.id + ' ' + h.hito + ' ' + (h.resp || ''))).map(h => ({key: 'hito:' + h.id, ty: 'HITO', t: `${h.id} · ${h.hito}`, s: `${AMAP[h.area].corto} · ${fd(h.fecha)} · ${h.cumpl}`})),
    ...ALLK.filter(k => m(k.id + ' ' + k.ind)).map(k => ({key: 'kpi:' + k.id, ty: 'KPI', t: `${k.id} · ${k.ind}`, s: `${AMAP[k.area].corto} · ${k.estado}`}))
  ].slice(0, 14);
  resHl = 0;
  $('#sres').innerHTML = RES.length ? RES.map((r, i) => `<button role="option" id="res-${i}" data-res="${i}" aria-selected="${i === resHl}"><span class="ty">${r.ty}</span><span style="min-width:0"><b style="display:block;font-size:13px">${esc(r.t)}</b><span class="lbl-s">${esc(r.s)}</span></span></button>`).join('') : `<div class="no">Sin resultados para «${esc(q)}»</div>`;
  showRes(true);
}
function showRes(on) { $('#sres').hidden = !on; $('#q').setAttribute('aria-expanded', on); }
$('#sres').addEventListener('click', e => { const b = e.target.closest('[data-res]'); if (b) { e.stopPropagation(); showRes(false); openObj(RES[+b.dataset.res].key); } });
$('#q').addEventListener('keydown', e => {
  if ($('#sres').hidden || !RES.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); resHl = (resHl + (e.key === 'ArrowDown' ? 1 : -1) + RES.length) % RES.length; $$('#sres [data-res]').forEach((b, i) => b.setAttribute('aria-selected', i === resHl)); $('#q').setAttribute('aria-activedescendant', 'res-' + resHl); $('#res-' + resHl)?.scrollIntoView({block: 'nearest'}); }
  if (e.key === 'Enter') { e.preventDefault(); showRes(false); openObj(RES[resHl].key); }
});
window.addEventListener('resize', () => requestAnimationFrame(moveInd));

/* arranque */
hydrateIcons();
applyTheme();
setTimeout(render, RM.matches ? 0 : 220);
</script>
